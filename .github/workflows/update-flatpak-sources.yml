# Opens a pull request when llama.cpp or SPIRV-Headers publish a newer tag
# than the one pinned in the Flatpak manifest.
#
# Needs "Allow GitHub Actions to create and approve pull requests" enabled
# under Settings → Actions → General → Workflow permissions.
name: Check Flatpak sources for updates

on:
  schedule:
    - cron: "23 5 * * 1" # Mondays
  workflow_dispatch:

jobs:
  flatpak-external-data-checker:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push update branches in this repository
      pull-requests: write # open update pull requests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker://ghcr.io/flathub-infra/flatpak-external-data-checker:latest
        env:
          GIT_AUTHOR_NAME: Flatpak External Data Checker
          GIT_COMMITTER_NAME: Flatpak External Data Checker
          # Attribute commits to github-actions[bot].
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --update --never-fork io.github.tduarte.Pipoca.json
